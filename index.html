/* ---------------------------- expand ------------------------------ */

function expandItem(id) {
  var it = S.items.find(function (i) { return i.id === id; });
  if (!it || it.expanding) return;
  it.expanding = true; render();

  var articleText = "";
  getText(it.url).then(function (html) {
    articleText = stripHtml(html.slice(0, 200000)).slice(0, 6000);
    if (articleText.length < 200) throw new Error("could not extract article text");
    var prompt =
"Summarise the article text below for a defence staff officer in 35-55 words — what happened, who is involved, why it matters. Use only what the text states. Do not add outside knowledge or invent detail.\n\n" +
"HEADLINE: " + it.hl + "\n\nARTICLE TEXT:\n" + articleText + "\n\n" +
"Return ONLY the summary sentence. No preamble, no quotation marks, no labels.";
    return runChain(prompt);
  }).then(function (out) {
    it.sum = out.trim().replace(/^["']|["']$/g, "").slice(0, 480);
    it.desc = articleText.slice(0, 400);
    it.expanding = false;
    saveFeed(); render();
  }).catch(function (e) {
    it.expanding = false;
    S.err = "Could not expand that item — " + (e.message || "the source blocked full-text access") + ". Its headline summary is kept.";
    render();
  });
}

/* ---------------------------- render ------------------------------ */

function unseenItems() {
  var seen = {}; S.seen.forEach(function (i) { seen[i] = 1; });
  return S.items.filter(function (i) { return !seen[i.id]; });
}
function isFlagged(i) {
  if (i.pri && i.pri !== "routine") return true;
  var blob = (i.hl + " " + (i.sum || "")).toLowerCase();
  return S.watch.filter(function (w) { return w.alert && w.on; })
    .some(function (w) { return matchesTerm(w.term, blob); });
}
function stClass(s) {
  if (!s) return "idle";
  if (s === "ok") return "ok";
  if (s === "rate limited" || s === "no key") return "warn";
  return "bad";
}

function itemNode(it, isNew) {
  var thin = it.sum && !(it.desc && it.desc.length > 20);
  return el("div", { class: "item", "data-pri": it.pri },
    el("div", { class: "item-top" },
      el("span", { class: "grade", "data-p": it.pri, text: it.grd }),
      el("span", { class: "stamp", text: dayStamp(it.dt) }),
      isNew ? el("span", { class: "new", text: "NEW" }) : null),
    el("a", { class: "hl-link", href: it.url || "#", target: "_blank", rel: "noreferrer" },
      el("div", { class: "hl-wrap" },
        el("h3", { class: "hl", text: it.hl }),
        it.img ? (function () {
          var im = el("img", { class: "thumb", src: it.img, alt: "", loading: "lazy" });
          im.addEventListener("error", function () {
            if (im.parentNode) im.parentNode.removeChild(im);
          });
          return im;
        })() : null)),
    el("p", { class: "sum", "data-raw": it.sum ? "0" : "1",
      text: it.sum || "Not summarised — no engine answered on the last sweep." }),
    el("div", { class: "meta" },
      el("span", { class: "tag", text: it.src }),
      el("span", { class: "tag cat", text: it.cat }),
      el("span", { class: "tag", text: it.via }),
      it.pri !== "routine" ? el("span", { class: "tag pri", "data-p": it.pri, text: it.pri }) : null,
      thin ? el("span", { style: "align-self:center;color:var(--mute)", text: "headline only" }) : null),
    thin ? el("button", { class: "expand", disabled: it.expanding,
        text: it.expanding ? "Fetching full article…" : "Expand from source ↓",
        on: { click: function () { expandItem(it.id); } } }) : null);
}

function render() {
  var app = document.getElementById("app");
  var scrollTo = 0;
  app.innerHTML = "";

  /* header */
  var tabs = el("nav", { class: "tabs" });
  [["feed","Feed",S.items.length],["brief","Brief",0],
   ["watch","Watch",S.watch.filter(function(w){return w.on;}).length],["setup","Setup",0]].forEach(function (t) {
    tabs.appendChild(el("button", { class: "tab", "data-on": S.tab === t[0] ? "1" : "0",
      on: { click: function () { S.tab = t[0]; render(); window.scrollTo(0, 0); } } },
      t[1], t[2] > 0 ? el("i", { text: String(t[2]) }) : null));
  });
  app.appendChild(el("header", { class: "head" },
    el("div", { class: "head-in" },
      el("h1", { text: "Sentinel" }),
      el("span", { class: "dtg", text: dtg(new Date()) })),
    tabs));

  /* alert strip */
  var alerts = unseenItems().filter(isFlagged);
  if (alerts.length) {
    app.appendChild(el("div", { class: "alert" },
      el("span", { class: "dot" }),
      el("span", { class: "alert-t", text: alerts.length + " flagged · " + unseenItems().length + " unread" }),
      el("button", { class: "link", text: "Mark all read",
        on: { click: function () { S.seen = S.items.map(function (i) { return i.id; }); saveFeed(); render(); } } })));
  }

  /* scan bar */
  app.appendChild(el("div", { class: "scan" },
    el("button", { class: "sweep", disabled: S.scanning, text: S.scanning ? "Sweeping" : "Sweep now",
      on: { click: function () { if (!S.scanning) sweep(); } } }),
    el("span", { class: "scan-msg", id: "scanmsg",
      text: S.scanning ? S.status
        : S.lastScan ? "Last sweep " + dtg(new Date(S.lastScan)) : "No sweep run yet" })));
  if (S.scanning) app.appendChild(el("div", { class: "prog" }, el("i")));
  if (S.err) app.appendChild(el("div", { class: "err", text: S.err }));

  if (S.tab === "feed") renderFeed(app);
  if (S.tab === "watch") renderWatch(app);
  if (S.tab === "brief") renderBrief(app);
  if (S.tab === "setup") renderSetup(app);
}

function renderFeed(app) {
  var bar = el("div", { class: "viewbar" });
  var g1 = el("div", { class: "grp" });
  [["cards", "Cards"], ["timeline", "Timeline"]].forEach(function (v) {
    g1.appendChild(el("button", { class: "seg", "data-on": S.view === v[0] ? "1" : "0", text: v[1],
      on: { click: function () { S.view = v[0]; render(); } } }));
  });
  bar.appendChild(g1);
  if (S.view !== "timeline") {
    bar.appendChild(el("div", { class: "vdiv" }));
    var g2 = el("div", { class: "grp" });
    [["newest", "Newest"], ["urgency", "Urgency"]].forEach(function (s) {
      g2.appendChild(el("button", { class: "seg", "data-on": S.sort === s[0] ? "1" : "0", text: s[1],
        on: { click: function () { S.sort = s[0]; render(); } } }));
    });
    bar.appendChild(g2);
  }
  app.appendChild(bar);

  var missing = S.items.filter(function (i) { return !i.sum; }).length;
  if (missing) {
    app.appendChild(el("div", { class: "alert" },
      el("span", { class: "dot" }),
      el("span", { class: "alert-t", text: missing + " item" + (missing === 1 ? "" : "s") + " not summarised" }),
      el("button", { class: "link", disabled: S.scanning, text: "Summarise missing",
        on: { click: function () { if (!S.scanning) summariseMissing(); } } })));
  }

  var st = S.lastSweepStats;
  if (st && !S.scanning) {
    app.appendChild(el("div", { class: "tally" },
      el("span", { text: "Last sweep: " + st.collected + " collected · " + st.kept + " kept · " +
        st.irrelevant + " off-keyword · " + st.old + " too old" }),
      el("button", { class: "link", text: "Matching: " + (S.match || "balanced"),
        on: { click: function () { S.tab = "setup"; render(); window.scrollTo(0, 0); } } })));
  }

  if (S.items.length) {
    var cats = ["ALL"];
    S.items.forEach(function (i) { if (cats.indexOf(i.cat) === -1) cats.push(i.cat); });
    var f = el("div", { class: "filters" });
    cats.forEach(function (c) {
      f.appendChild(el("button", { class: "chip", "data-on": S.filter === c ? "1" : "0", text: c,
        on: { click: function () { S.filter = c; render(); } } }));
    });
    app.appendChild(f);
  }
  var shown = S.filter === "ALL" ? S.items : S.items.filter(function (i) { return i.cat === S.filter; });
  if (!shown.length) {
    app.appendChild(el("div", { class: "empty" },
      el("b", { text: "Feed is empty" }),
      "Sweep now pulls headlines from GDELT, Google News and your outlet feeds, then summarises them on whichever engine answers first. Add a key in SETUP before the first sweep."));
    return;
  }

  if (S.view === "timeline") {
    renderTimeline(app, shown);
    return;
  }

  shown = shown.slice().sort(function (a, b) {
    if (S.sort === "urgency") {
      var rank = { flash: 0, priority: 1, routine: 2 };
      var r = (rank[a.pri] === undefined ? 2 : rank[a.pri]) - (rank[b.pri] === undefined ? 2 : rank[b.pri]);
      if (r) return r;
    }
    return String(b.dt).localeCompare(String(a.dt));
  });

  var seen = {}; S.seen.forEach(function (i) { seen[i] = 1; });
  shown.forEach(function (i) { app.appendChild(itemNode(i, !seen[i.id])); });
  app.appendChild(el("div", { class: "legend", html:
    "GRADE = SOURCE RELIABILITY A–F / INFORMATION CREDIBILITY 1–6<br>" +
    "A RELIABLE · B USUALLY RELIABLE · C FAIRLY RELIABLE · D NOT USUALLY RELIABLE<br>" +
    "1 CONFIRMED · 2 PROBABLY TRUE · 3 POSSIBLY TRUE · 4 DOUBTFUL<br>" +
    "GRADES ARE MACHINE-ASSIGNED. VERIFY BEFORE USE." }));
}

/* Strict chronological ticker, newest first, grouped by day. Every entry
   is one line so the shape of a busy day is visible at a glance. */
function renderTimeline(app, list) {
  var sorted = list.slice().sort(function (a, b) { return String(b.dt).localeCompare(String(a.dt)); });
  var wrap = el("div", { class: "tl" });
  var lastDay = null;
  var seen = {}; S.seen.forEach(function (i) { seen[i] = 1; });

  sorted.forEach(function (it) {
    var day = dayStamp(it.dt);
    if (day !== lastDay) {
      wrap.appendChild(el("div", { class: "tl-day", text: day }));
      lastDay = day;
    }
    wrap.appendChild(el("a", { class: "tl-row", href: it.url || "#", target: "_blank", rel: "noreferrer" },
      el("span", { class: "tl-time", text: timeStamp(it.dt) }),
      el("span", { class: "tl-dot", "data-p": it.pri }),
      el("div", { class: "tl-body" },
        el("div", { class: "tl-hl" },
          !seen[it.id] ? el("span", { class: "tl-new" }) : null,
          it.hl),
        el("div", { class: "tl-meta" },
          el("b", { text: it.cat }),
          el("span", { text: " · " + it.src + " · " + it.grd +
            (it.pri !== "routine" ? " · " + it.pri : "") })))));
  });
  app.appendChild(wrap);
  app.appendChild(el("div", { class: "legend", text:
    "Times are India Standard Time. Tap any line to open the source." }));
}

function renderWatch(app) {
  var cats = [];
  S.watch.forEach(function (w) { if (cats.indexOf(w.cat) === -1) cats.push(w.cat); });

  cats.forEach(function (cat) {
    var sec = el("div", { class: "sec" },
      el("div", { class: "sec-h" },
        el("span", { class: "sec-t", text: cat }),
        el("button", { class: "link", text: "Sweep " + cat, disabled: S.scanning,
          on: { click: function () { if (!S.scanning) sweep(cat); } } })));
    S.watch.filter(function (w) { return w.cat === cat; }).forEach(function (w) {
      sec.appendChild(el("div", { class: "row" },
        el("button", { class: "box", "data-on": w.on ? "1" : "0", "aria-label": w.on ? "Turn off" : "Turn on",
          on: { click: function () { w.on = !w.on; saveCfg(); render(); } } }),
        el("span", { class: "term", "data-off": w.on ? "0" : "1", text: w.term }),
        el("button", { class: "bell", "data-on": w.alert ? "1" : "0", text: "ALERT",
          on: { click: function () { w.alert = !w.alert; saveCfg(); render(); } } }),
        el("button", { class: "x", text: "×", "aria-label": "Remove keyword",
          on: { click: function () {
            S.watch = S.watch.filter(function (y) { return y.id !== w.id; }); saveCfg(); render(); } } })));
    });
    app.appendChild(sec);
  });

  var tIn = el("input", { placeholder: "What to look for", value: "" });
  var cIn = el("input", { placeholder: "Category (leave blank to auto-assign)", value: "" });
  function add() {
    var term = tIn.value.trim();
    if (!term) return;
    var typed = cIn.value.trim();
    if (typed) {
      var c = typed.toUpperCase().slice(0, 14);
      S.watch.push({ id: hash(term + c), term: term, cat: c, alert: false, on: true });
      saveCfg(); render();
      return;
    }
    S.tagging = term;
    render();
    autoTag(term).then(function (cat) {
      S.watch.push({ id: hash(term + cat), term: term, cat: cat, alert: false, on: true });
      S.tagging = ""; saveCfg(); render();
    });
  }
  tIn.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  cIn.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });

  app.appendChild(el("div", { class: "sec" },
    el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Add keyword" })),
    tIn,
    el("div", { class: "add" }, cIn,
      el("button", { class: "addbtn", text: "Add", on: { click: add } })),
    S.tagging ? el("div", { class: "hint", text: "Assigning a category to \u201c" + S.tagging + "\u201d\u2026" }) : null,
    el("div", { class: "hint", text: "Leave the category blank and one is assigned automatically. ALERT raises the strip at the top of every tab whenever that keyword appears in something you have not read." })));
  /* recommended, non-destructive */
  var have = {};
  S.watch.forEach(function (w) { have[w.term.toLowerCase()] = 1; });
  var offer = RECOMMENDED.filter(function (r) { return !have[r.term.toLowerCase()]; });
  if (offer.length) {
    var rsec = el("div", { class: "sec" },
      el("div", { class: "sec-h" },
        el("span", { class: "sec-t", text: "Suggested keywords" }),
        el("button", { class: "link", text: "Add all",
          on: { click: function () {
            offer.forEach(function (r) {
              S.watch.push({ id: hash(r.term + r.cat), term: r.term, cat: r.cat, alert: false, on: true });
            });
            saveCfg(); render();
          } } })));
    var wrap = el("div", { class: "meta", style: "gap:7px" });
    offer.forEach(function (r) {
      wrap.appendChild(el("button", { class: "tag suggest", text: "+ " + r.term,
        on: { click: function () {
          S.watch.push({ id: hash(r.term + r.cat), term: r.term, cat: r.cat, alert: false, on: true });
          saveCfg(); render();
        } } }));
    });
    rsec.appendChild(wrap);
    rsec.appendChild(el("div", { class: "hint", text:
      "Short, distinctive terms match better than long phrases. Acronyms and proper nouns are strongest; words like India, defence or security appear in half of all news and narrow nothing. Tap to add — nothing is removed." }));
    app.appendChild(rsec);
  }
}

function renderBrief(app) {
  app.appendChild(el("div", { class: "scan" },
    el("button", { class: "sweep", disabled: S.briefing || S.scanning,
      text: S.briefing ? "Compiling" : "Compile brief",
      on: { click: function () { if (!S.briefing && !S.scanning) makeBrief(); } } }),
    el("span", { class: "scan-msg", text: S.briefing ? (S.briefStatus || "Reading the feed…")
      : S.items.filter(function (i) { return i.sum; }).length + " summarised items in scope" })));
  if (S.briefing) app.appendChild(el("div", { class: "prog" }, el("i")));

  var secs = S.briefSections || [];
  if (S.brief || secs.length) {
    if (S.brief) {
      app.appendChild(el("div", { class: "sec" },
        el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Bottom line" })),
        el("div", { class: "brief-body", text: S.brief })));
    }
    secs.forEach(function (s) {
      app.appendChild(el("div", { class: "sec" },
        el("div", { class: "sec-h" },
          el("span", { class: "sec-t", text: s.cat }),
          el("span", { class: "tag", text: s.n + (s.n === 1 ? " item" : " items") })),
        el("div", { class: "brief-body", text: s.text })));
    });
    return;
  }
  if (!S.briefing) app.appendChild(el("div", { class: "empty" },
    el("b", { text: "No brief compiled" }),
    "Compile brief writes about 100 words on each category in your feed, then a bottom line drawn across all of them."));
}

function renderSetup(app) {
  /* keyword matching */
  var msec = el("div", { class: "sec" },
    el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Keyword matching" })));
  var mgrp = el("div", { class: "grp" });
  [["strict", "Strict"], ["balanced", "Balanced"], ["broad", "Broad"]].forEach(function (m) {
    mgrp.appendChild(el("button", { class: "seg", "data-on": (S.match || "balanced") === m[0] ? "1" : "0",
      text: m[1], on: { click: function () { S.match = m[0]; saveCfg(); render(); } } }));
  });
  msec.appendChild(el("div", { class: "viewbar", style: "padding:0" }, mgrp));
  msec.appendChild(el("div", { class: "hint", text:
    "How closely a headline must match a keyword to enter the feed. Broad keeps anything sharing a distinctive word; Strict wants two. If a category has gone quiet, widen this before rewriting your keywords." }));
  app.appendChild(msec);

  /* engines */
  var sec = el("div", { class: "sec" },
    el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Summary engines" })));

  var keysList = Object.keys(PROVIDERS);
  sec.appendChild(el("span", { class: "lbl", text: "Primary" }));
  var sel1 = el("select");
  keysList.forEach(function (p) {
    sel1.appendChild(el("option", { value: p, selected: S.chain[0] === p ? "selected" : null, text: PROVIDERS[p].label }));
  });
  sel1.addEventListener("change", function () {
    var v = sel1.value;
    S.chain = [v].concat(S.chain.filter(function (x) { return x !== v; }));
    saveCfg(); render();
  });
  sec.appendChild(sel1);

  sec.appendChild(el("span", { class: "lbl", text: "Falls back to" }));
  var sel2 = el("select");
  keysList.filter(function (p) { return p !== S.chain[0]; }).forEach(function (p) {
    sel2.appendChild(el("option", { value: p, selected: S.chain[1] === p ? "selected" : null, text: PROVIDERS[p].label }));
  });
  sel2.addEventListener("change", function () {
    var v = sel2.value;
    S.chain = [S.chain[0], v].concat(S.chain.filter(function (x) { return x !== v && x !== S.chain[0]; }));
    saveCfg(); render();
  });
  sec.appendChild(sel2);

  sec.appendChild(el("div", { class: "hint", text:
    "A rate limit or an error on the primary sends the request straight to the next engine. The order is remembered between sessions." }));
  S.chain.forEach(function (p) {
    sec.appendChild(el("div", { class: "eng" },
      el("span", { text: PROVIDERS[p] ? PROVIDERS[p].label : p }),
      el("span", { class: "st", "data-s": stClass(S.engine[p]), text: S.engine[p] || "idle" })));
  });
  app.appendChild(sec);

  /* keys */
  var ksec = el("div", { class: "sec" },
    el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Keys" })));
  keysList.forEach(function (p) {
    var inp = el("input", { class: "mono", type: "password", placeholder: PROVIDERS[p].hint });
    inp.value = S.keys[p] || "";
    inp.addEventListener("input", function () { S.keys[p] = inp.value.trim(); saveCfg(); });
    ksec.appendChild(el("div", { style: "margin-bottom:16px" },
      el("span", { class: "lbl", text: PROVIDERS[p].label }),
      inp,
      el("div", { class: "hint", text: PROVIDERS[p].note })));
  });
  ksec.appendChild(el("div", { class: "hint warn", text:
    "Keys are stored in this browser on this device only. That is not a secure keychain — rotate them if the phone is ever out of your hands." }));
  app.appendChild(ksec);

  /* feeds */
  var fsec = el("div", { class: "sec" },
    el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Outlet feeds" })));
  S.feeds.forEach(function (f) {
    fsec.appendChild(el("div", { class: "row" },
      el("button", { class: "box", "data-on": f.on ? "1" : "0", "aria-label": f.on ? "Turn off" : "Turn on",
        on: { click: function () { f.on = !f.on; saveCfg(); render(); } } }),
      el("div", { class: "term", "data-off": f.on ? "0" : "1" },
        el("span", { text: f.name }),
        el("div", { class: "sub", text: S.feedState[f.id] || "not read yet" })),
      el("button", { class: "x", text: "×", "aria-label": "Remove feed",
        on: { click: function () {
          S.feeds = S.feeds.filter(function (y) { return y.id !== f.id; }); saveCfg(); render(); } } })));
  });
  var fIn = el("input", { class: "mono", placeholder: "bbc.com  or  site.com/feed" });
  function addFeed() {
    var raw = fIn.value.trim();
    if (!raw) return;
    S.feedAdd = "Looking for a feed at " + raw + "…";
    render();
    discoverFeed(raw).then(function (feedUrl) {
      if (S.feeds.some(function (f) { return f.url === feedUrl; })) {
        S.feedAdd = "Already added: " + feedUrl;
      } else {
        S.feeds.push({ id: hash(feedUrl), name: domainOf(feedUrl), url: feedUrl, on: true });
        S.feedAdd = "Added " + feedUrl;
        saveCfg();
      }
      render();
    }, function (e) {
      S.feedAdd = "Could not find a feed — " + (e.message || "unreachable") +
        ". Try the feed address directly, e.g. feeds.bbci.co.uk/news/world/rss.xml";
      render();
    });
  }
  fIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addFeed(); });
  fsec.appendChild(el("div", { class: "add" }, fIn,
    el("button", { class: "addbtn", text: "Add", on: { click: addFeed } })));
  if (S.feedAdd) fsec.appendChild(el("div", { class: "hint", text: S.feedAdd }));
  fsec.appendChild(el("div", { class: "hint", text:
    "Feed addresses change without warning. After each sweep every line shows how many items it returned, so anything reading unreachable can be replaced or switched off." }));
  app.appendChild(fsec);

  /* relays */
  var rsec = el("div", { class: "sec" },
    el("div", { class: "sec-h" },
      el("span", { class: "sec-t", text: "Fetch relays" }),
      el("button", { class: "link", text: "Test relays", on: { click: testRelays } })));
  S.relays.forEach(function (r, idx) {
    var inp = el("input", { class: "mono" });
    inp.value = r;
    inp.addEventListener("input", function () { S.relays[idx] = inp.value.trim(); saveCfg(); });
    rsec.appendChild(el("div", { style: "margin-bottom:12px" },
      inp,
      el("div", { class: "eng" },
        el("span", { text: S.bestRelay === r ? "in use" : "standby" }),
        el("span", { class: "st",
          "data-s": stClass(S.relayState[r] === "working" ? "ok" : S.relayState[r]),
          text: S.relayState[r] || "untested" }))));
  });
  var nrIn = el("input", { class: "mono", placeholder: "https://relay…/?url=" });
  function addRelay() {
    var v = nrIn.value.trim();
    if (v.indexOf("http") !== 0) return;
    S.relays.push(v); saveCfg(); render();
  }
  nrIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addRelay(); });
  rsec.appendChild(el("div", { class: "add" }, nrIn,
    el("button", { class: "addbtn", text: "Add", on: { click: addRelay } })));
  rsec.appendChild(el("div", { class: "hint", text:
    "News sites refuse direct browser requests, so feeds go through a relay. Each is tried in turn until one answers, and the one that works is remembered. Every request times out after 8 seconds, so a dead relay costs seconds rather than stalling the sweep." }));
  app.appendChild(rsec);

  /* reset */
  app.appendChild(el("div", { class: "sec" },
    el("div", { class: "sec-h" }, el("span", { class: "sec-t", text: "Stored data" })),
    el("div", { class: "hint", text:
      "Everything lives in this browser on this device. Nothing is sent anywhere except to the news sources and the engine you chose." }),
    el("div", { class: "add" },
      el("button", { class: "addbtn", text: "Clear feed", on: { click: function () {
        S.items = []; S.seen = []; S.brief = ""; S.lastScan = null; saveFeed(); render();
      } } }),
      el("button", { class: "addbtn", text: "Reset all", on: { click: function () {
        if (!confirm("Erase keywords, feeds, keys and stored articles?")) return;
        try { localStorage.removeItem("mw:config"); localStorage.removeItem("mw:feed"); } catch (e) {}
        location.reload();
      } } }))));

  /* build + update */
  app.appendChild(el("div", { class: "sec" },
    el("div", { class: "sec-h" },
      el("span", { class: "sec-t", text: "Build" }),
      el("span", { class: "st", "data-s": "idle", text: BUILD })),
    el("div", { class: "hint", text:
      "Check this after publishing an update. If it still shows the old build, tap below to discard the cached copy and pull the current one." }),
    el("div", { class: "add" },
      el("button", { class: "addbtn", text: "Force update", on: { click: function () {
        var done = function () { location.reload(true); };
        if (!("caches" in window)) return done();
        caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }).then(function () {
          if (!("serviceWorker" in navigator)) return;
          return navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          });
        }).then(done, done);
      } } }))));
}

/* ---------------------------- boot -------------------------------- */

load();
render();
setInterval(function () {
  if (S.tab === "feed" && !S.scanning) {
    var n = document.querySelector(".dtg");
    if (n) n.textContent = dtg(new Date());
  }
}, 30000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    /* updateViaCache:"none" stops Safari serving sw.js itself from HTTP cache —
       without it a new build is never even discovered, which is why updates
       previously needed the icon deleted and website data cleared by hand. */
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(function (reg) {
        reg.update();
        /* check again whenever the app is reopened from the background */
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) reg.update();
        });
      })
      .catch(function () {});

    /* when a new worker takes control, reload once so the fresh build shows */
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}
</script>
</body>
</html>

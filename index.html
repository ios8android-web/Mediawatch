<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sentinel">
<meta name="theme-color" content="#F6F7FB">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Sentinel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F6F7FB; --surface:#FFFFFF; --panel:#F1F3F9; --panel2:#EDEFF7;
  --line:#E6E9F2; --line2:#EFF1F7;
  --text:#171A2B; --text2:#3A3F55; --mute:#646A80;
  --accent:#5B5BD6; --accent-soft:#ECEBFF;

  /* pastel severity + status */
  --flash-bg:#FFE3DE; --flash-fg:#B23A26;
  --prio-bg:#FDF0D2; --prio-fg:#8C6206;
  --ok-bg:#DEF3E7; --ok-fg:#15794A;
  --info-bg:#E1EDFC; --info-fg:#1B5FA0;

  --shadow:0 1px 2px rgba(23,26,43,.04), 0 6px 20px rgba(23,26,43,.05);
  --shadow-sm:0 1px 2px rgba(23,26,43,.05);
  --r:16px; --r-sm:10px;

  --disp:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  min-height:100dvh; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--mono)}

/* ---- header ---- */
.head{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px}
h1{font-family:var(--disp);letter-spacing:-.02em;font-weight:800;font-size:22px;margin:0;color:var(--text)}
h1::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);
  border-radius:3px;margin-right:9px;margin-bottom:1px;vertical-align:middle}
.dtg{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.04em}
.tabs{display:flex;gap:4px;padding:0 12px}
.tab{flex:1;padding:11px 2px 13px;font-family:var(--disp);letter-spacing:0;font-size:13.5px;
  font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;text-align:center}
.tab[data-on="1"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-size:10px;color:var(--accent);vertical-align:super;margin-left:3px;font-weight:700}

/* ---- alert ---- */
.alert{display:flex;align-items:center;gap:10px;margin:14px 16px 0;padding:12px 14px;
  background:var(--prio-bg);border-radius:var(--r-sm)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--prio-fg);flex:none}
.alert-t{font-size:12.5px;font-weight:600;color:var(--prio-fg);flex:1;letter-spacing:-.01em}
.link{font-size:12px;font-weight:600;color:var(--accent);flex:none}
.link[disabled]{opacity:.4}

/* ---- scan bar ---- */
.scan{display:flex;align-items:center;gap:12px;padding:14px 16px}
.sweep{flex:none;padding:12px 20px;background:var(--accent);color:#fff;font-family:var(--disp);
  font-weight:700;font-size:14px;border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:0 2px 10px rgba(91,91,214,.24)}
.sweep[disabled]{background:var(--line);color:var(--mute);box-shadow:none}
.scan-msg{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.prog{height:3px;background:var(--line);overflow:hidden;margin:0 16px;border-radius:2px}
.prog i{display:block;height:100%;width:34%;background:var(--accent);border-radius:2px;
  animation:slide 1.15s linear infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

/* ---- view / sort bar ---- */
.viewbar{display:flex;align-items:stretch;gap:8px;padding:4px 16px 0;flex-wrap:wrap}
.viewbar .grp{display:flex;gap:4px;flex:1;min-width:130px;background:var(--panel);
  padding:4px;border-radius:var(--r-sm)}
.seg{flex:1;padding:8px 4px;font-family:var(--disp);font-size:12px;font-weight:600;
  color:var(--mute);text-align:center;border-radius:7px}
.seg[data-on="1"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.vdiv{display:none}

/* ---- filters ---- */
.tally{display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:10px 13px;background:var(--panel);border-radius:var(--r-sm);font-size:11px;color:var(--mute);line-height:1.4}
.tally span{flex:1}
.filters{display:flex;gap:7px;padding:14px 16px 4px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;font-size:12px;font-weight:600;color:var(--mute);
  background:var(--panel);border-radius:20px;white-space:nowrap}
.chip[data-on="1"]{background:var(--accent-soft);color:var(--accent)}

/* ---- item cards ---- */
.item{display:block;margin:10px 16px;padding:16px;background:var(--surface);
  border-radius:var(--r);box-shadow:var(--shadow);border-left:4px solid transparent}
.item[data-pri="flash"]{border-left-color:var(--flash-fg)}
.item[data-pri="priority"]{border-left-color:var(--prio-bg)}
.item-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.grade{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  padding:4px 8px;border-radius:6px;background:var(--panel);color:var(--mute);flex:none}
.grade[data-p="flash"]{background:var(--flash-bg);color:var(--flash-fg)}
.grade[data-p="priority"]{background:var(--prio-bg);color:var(--prio-fg)}
.stamp{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.03em}
.new{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--accent);
  background:var(--accent-soft);padding:3px 8px;border-radius:20px}
.hl-link{display:block;text-decoration:none;color:inherit}
.hl-wrap{display:flex;gap:12px;align-items:flex-start}
.hl-wrap .hl{flex:1;min-width:0}
.thumb{flex:none;width:76px;height:76px;object-fit:cover;border-radius:12px;
  background:var(--panel);margin-top:1px}
.hl{font-family:var(--disp);font-size:17px;font-weight:700;line-height:1.32;margin:0 0 8px;
  letter-spacing:-.015em;color:var(--text)}
.sum{font-size:14px;line-height:1.58;color:var(--text2);margin:0 0 12px}
.sum[data-raw="1"]{color:var(--mute);font-style:italic}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:10.5px;font-weight:600}
.tag{display:inline-block;padding:4px 9px;border-radius:7px;background:var(--panel);color:var(--mute)}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.pri{background:var(--prio-bg);color:var(--prio-fg)}
.tag.pri[data-p="flash"]{background:var(--flash-bg);color:var(--flash-fg)}
.tag.suggest{background:var(--accent-soft);color:var(--accent);font-weight:600;padding:7px 11px}
.expand{display:block;margin-top:12px;font-family:var(--disp);font-size:12px;font-weight:600;
  color:var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:var(--r-sm);
  text-align:center;width:100%}
.expand[disabled]{color:var(--mute);background:var(--panel)}

/* ---- timeline ---- */
.tl{padding:6px 16px 4px}
.tl-day{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mute);padding:18px 0 10px}
.tl-row{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;text-decoration:none;
  color:inherit;background:var(--surface);border-radius:var(--r-sm);margin-bottom:7px;
  box-shadow:var(--shadow-sm)}
.tl-time{flex:none;width:42px;font-family:var(--mono);font-size:10.5px;color:var(--mute);padding-top:2px}
.tl-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line);margin-top:6px}
.tl-dot[data-p="flash"]{background:var(--flash-fg)}
.tl-dot[data-p="priority"]{background:var(--prio-fg)}
.tl-body{flex:1;min-width:0}
.tl-hl{font-size:13.5px;font-weight:600;line-height:1.42;color:var(--text);letter-spacing:-.01em}
.tl-new{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);
  margin-right:7px;margin-bottom:1px}
.tl-meta{font-size:10px;font-weight:600;color:var(--mute);margin-top:4px}
.tl-meta b{color:var(--accent);font-weight:700}

/* ---- sections ---- */
.sec{margin:12px 16px;padding:18px;background:var(--surface);border-radius:var(--r);
  box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-t{font-family:var(--disp);font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.015em}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:none}
.term{flex:1;font-size:14.5px;line-height:1.4;min-width:0;word-break:break-word;color:var(--text)}
.term[data-off="1"]{color:var(--mute);text-decoration:line-through}
.sub{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:4px}
.bell{font-size:10px;font-weight:700;letter-spacing:.05em;padding:5px 9px;border-radius:6px;
  background:var(--panel);color:var(--mute);flex:none}
.bell[data-on="1"]{background:var(--prio-bg);color:var(--prio-fg)}
.x{color:var(--mute);font-size:19px;line-height:1;padding:6px 4px;flex:none}
input,select{width:100%;padding:12px 14px;background:var(--panel);border:1px solid transparent;
  color:var(--text);font-size:16px;border-radius:var(--r-sm);font-family:var(--body);-webkit-appearance:none}
input:focus,select:focus{background:var(--surface);border-color:var(--accent)}
input.mono{font-family:var(--mono);font-size:16px}
input::placeholder{color:var(--mute)}
.add{display:flex;gap:8px;margin-top:10px}
.addbtn{flex:none;padding:0 18px;background:var(--accent-soft);color:var(--accent);
  font-family:var(--disp);font-size:13.5px;font-weight:700;border-radius:var(--r-sm)}
.box{flex:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;
  position:relative;background:var(--surface)}
.box[data-on="1"]{border-color:var(--accent);background:var(--accent)}
.box[data-on="1"]::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.lbl{display:block;font-family:var(--disp);font-size:11.5px;font-weight:700;color:var(--text2);
  margin:16px 0 7px}
.lbl:first-child{margin-top:0}
.hint{font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:8px}
.hint.warn{color:var(--prio-fg);background:var(--prio-bg);padding:11px 13px;border-radius:var(--r-sm)}

.eng{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid var(--line2);
  font-size:12.5px;font-weight:600}
.eng span:first-child{flex:1;color:var(--text2)}
.st{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:6px}
.st[data-s="ok"]{background:var(--ok-bg);color:var(--ok-fg)}
.st[data-s="warn"]{background:var(--prio-bg);color:var(--prio-fg)}
.st[data-s="bad"]{background:var(--flash-bg);color:var(--flash-fg)}
.st[data-s="idle"]{background:var(--panel);color:var(--mute)}

.brief-body{font-size:14.5px;line-height:1.7;white-space:pre-wrap;color:var(--text2)}
.brief{margin:12px 16px;padding:20px;background:var(--surface);border-radius:var(--r);
  box-shadow:var(--shadow);font-size:14.5px;line-height:1.7;white-space:pre-wrap;color:var(--text2)}
.empty{margin:12px 16px;padding:44px 26px;text-align:center;color:var(--mute);font-size:13.5px;
  line-height:1.6;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.empty b{display:block;font-family:var(--disp);font-size:16px;font-weight:700;color:var(--text);
  margin-bottom:9px;letter-spacing:-.015em}
.err{margin:12px 16px;padding:13px 15px;background:var(--flash-bg);color:var(--flash-fg);
  border-radius:var(--r-sm);font-size:13px;line-height:1.55;font-weight:500}
.legend{padding:16px 20px 30px;font-family:var(--mono);font-size:10px;color:var(--mute);
  letter-spacing:.02em;line-height:1.9}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .prog i{width:100%}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =================================================================
   SENTINEL  —  single-file build
   Retrieval : GDELT DOC 2.0 + Google News RSS + direct outlet RSS
   Summaries : free LLM tier, primary -> secondary automatic failover
   Storage   : localStorage, on this device only
   ================================================================= */

/* ---------------------------- providers --------------------------- */

var PROVIDERS = {
  groq: {
    label: "Groq",
    note: "Llama 3.3 70B. Around 30 requests a minute. Does not train on what you send.",
    hint: "gsk_…  from console.groq.com",
    call: function (prompt, key) {
      return fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile", temperature: 0.2, max_tokens: 2000,
          messages: [{ role: "user", content: prompt }]
        })
      }).then(readOpenAI);
    }
  },
  gemini: {
    label: "Google Gemini",
    note: "Flash-Lite. Largest free daily allowance. Google may use free-tier inputs to improve its models.",
    hint: "AIza…  from aistudio.google.com",
    call: function (prompt, key) {
      return fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 2000 }
        })
      }).then(function (r) {
        if (r.status === 429) throw rateErr();
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function (d) {
        var c = d.candidates && d.candidates[0];
        return ((c && c.content && c.content.parts) || []).map(function (p) { return p.text || ""; }).join("");
      });
    }
  },
  openrouter: {
    label: "OpenRouter",
    note: "Free model pool. Around 20 requests a minute. Useful as a third leg.",
    hint: "sk-or-…  from openrouter.ai",
    call: function (prompt, key) {
      return fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({
          model: "meta-llama/llama-3.3-70b-instruct:free", temperature: 0.2, max_tokens: 2000,
          messages: [{ role: "user", content: prompt }]
        })
      }).then(readOpenAI);
    }
  }
};
function readOpenAI(r) {
  if (r.status === 429) throw rateErr();
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json().then(function (d) {
    return (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "";
  });
}
function rateErr() { var e = new Error("rate limited"); e.rate = true; return e; }

/* ---------------------------- sources ----------------------------- */

var WIRE = ["reuters.com","apnews.com","afp.com","bloomberg.com","aljazeera.com"];
var INDIAN = ["thehindu.com","indianexpress.com","hindustantimes.com","timesofindia","ptinews","aninews","theprint.in","economictimes","deccanherald"];
var DEFENCE = ["janes.com","defensenews.com","breakingdefense.com","defenseone.com","idrw.org","livefistdefence.com","orfonline.org","idsa.in","warontherocks.com"];

function classify(d) {
  d = (d || "").toLowerCase();
  if (WIRE.some(function (x) { return d.indexOf(x) > -1; })) return "wire";
  if (INDIAN.some(function (x) { return d.indexOf(x) > -1; })) return "indian";
  if (DEFENCE.some(function (x) { return d.indexOf(x) > -1; })) return "defence";
  return "other";
}
var RANK = { wire: 0, indian: 1, defence: 1, other: 3 };
var GRADES = { wire: "B2", indian: "B3", defence: "C3", other: "D4" };

var DEFAULT_FEEDS = [
  { id: "f1", name: "The Hindu — National", url: "https://www.thehindu.com/news/national/feeder/default.rss", on: true },
  { id: "f2", name: "Indian Express — India", url: "https://indianexpress.com/section/india/feed/", on: true },
  { id: "f3", name: "The Print", url: "https://theprint.in/feed/", on: true },
  { id: "f4", name: "Hindustan Times — India", url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml", on: true },
  { id: "f5", name: "Al Jazeera", url: "https://www.aljazeera.com/xml/rss/all.xml", on: true },
  { id: "f6", name: "ORF", url: "https://www.orfonline.org/feed", on: true },
  { id: "f7", name: "Livefist Defence", url: "https://www.livefistdefence.com/feed", on: true },
  { id: "f8", name: "IDRW", url: "https://idrw.org/feed/", on: true },
  { id: "f9", name: "Breaking Defense", url: "https://breakingdefense.com/feed/", on: true }
];

/* One concept per keyword. Proper nouns and acronyms carry the most signal;
   generic words like "India" or "defence" are deliberately absent because
   they appear in half of Indian news and narrow nothing. */
var SEED = [
  { term: "LAC", cat: "NORTHERN", alert: true },
  { term: "India China border", cat: "NORTHERN", alert: true },
  { term: "Line of Control", cat: "WESTERN", alert: true },
  { term: "Indian Army", cat: "FORCE", alert: false },
  { term: "defence procurement", cat: "PROCUREMENT", alert: false },
  { term: "DRDO", cat: "PROCUREMENT", alert: false },
  { term: "military satellite", cat: "SPACE", alert: false },
  { term: "space surveillance", cat: "SPACE", alert: false },
  { term: "artillery", cat: "FIRES", alert: false },
  { term: "precision munition", cat: "FIRES", alert: false },
  { term: "Pinaka", cat: "FIRES", alert: false },
  { term: "BrahMos", cat: "FIRES", alert: false }
];

/* Offered in WATCH, added one at a time — never applied automatically. */
var RECOMMENDED = [
  { term: "LAC", cat: "NORTHERN" },
  { term: "India China border", cat: "NORTHERN" },
  { term: "Ladakh", cat: "NORTHERN" },
  { term: "Line of Control", cat: "WESTERN" },
  { term: "LoC ceasefire", cat: "WESTERN" },
  { term: "Indian Army", cat: "FORCE" },
  { term: "defence procurement", cat: "PROCUREMENT" },
  { term: "DRDO", cat: "PROCUREMENT" },
  { term: "HAL", cat: "PROCUREMENT" },
  { term: "AMCA", cat: "AIR" },
  { term: "Ghatak drone", cat: "AIR" },
  { term: "loitering munition", cat: "AIR" },
  { term: "military satellite", cat: "SPACE" },
  { term: "space surveillance", cat: "SPACE" },
  { term: "ISRO launch", cat: "SPACE" },
  { term: "artillery", cat: "FIRES" },
  { term: "Pinaka", cat: "FIRES" },
  { term: "precision munition", cat: "FIRES" },
  { term: "BrahMos", cat: "FIRES" },
  { term: "Agni missile", cat: "FIRES" },
  { term: "submarine", cat: "MARITIME" },
  { term: "Indian Ocean", cat: "MARITIME" }
];

var BUILD = "v16 · IST";

var DEFAULT_RELAYS = [
  "https://corsproxy.io/?url=",
  "https://api.codetabs.com/v1/proxy/?quest=",
  "https://api.allorigins.win/raw?url=",
  "https://proxy.killcors.com/?url="
];
var MAX_AGE_MS = 7 * 24 * 3600 * 1000;   /* nothing older than a week enters the feed */
var FETCH_TIMEOUT = 8000;   /* nothing is allowed to stall the queue */
var POOL_LIMIT = 5;         /* simultaneous requests */

/* ---------------------------- utilities --------------------------- */

var MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function p2(n) { return String(n).padStart(2, "0"); }
/* All times shown in India Standard Time (UTC+5:30). Stored timestamps stay
   ISO/UTC internally; only display is converted. */
var IST_OFFSET = 5.5 * 3600 * 1000;
function toIST(d) { return new Date(d.getTime() + IST_OFFSET); }

function dtg(d) {
  if (!(d instanceof Date) || isNaN(d)) return "------ IST";
  var i = toIST(d);
  return p2(i.getUTCDate()) + p2(i.getUTCHours()) + p2(i.getUTCMinutes()) + " IST " +
         MON[i.getUTCMonth()] + " " + String(i.getUTCFullYear()).slice(2);
}
function dayStamp(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return "DATE UNK";
  var i = toIST(d);
  return p2(i.getUTCDate()) + " " + MON[i.getUTCMonth()] + " " + String(i.getUTCFullYear()).slice(2);
}
function hash(s) {
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return "x" + Math.abs(h).toString(36);
}
function domainOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
function gdeltDay(s) {
  if (!s || s.length < 8) return new Date().toISOString().slice(0, 10);
  return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
}
/* GDELT's seendate is "YYYYMMDDTHHMMSSZ" — keep full precision so same-day
   items still order correctly and a timeline can show a real time of day. */
function gdeltISO(s) {
  if (!s || s.length < 15) return new Date().toISOString();
  var iso = s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8) + "T" +
            s.slice(9, 11) + ":" + s.slice(11, 13) + ":" + s.slice(13, 15) + "Z";
  var d = new Date(iso);
  return isNaN(d) ? new Date().toISOString() : d.toISOString();
}
function timeStamp(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return "----";
  var i = toIST(d);
  return p2(i.getUTCHours()) + p2(i.getUTCMinutes());
}
/* Strip the parts of a URL that differ without changing the article, so the
   same story fetched twice does not appear twice. */
function canonUrl(u) {
  var s = String(u || "").trim().toLowerCase();
  s = s.replace(/^https?:\/\//, "").replace(/^www\./, "");
  s = s.split("#")[0];
  var q = s.indexOf("?");
  if (q > -1) {
    var base = s.slice(0, q);
    var kept = s.slice(q + 1).split("&").filter(function (p) {
      var k = p.split("=")[0];
      return k && !/^(utm_|fbclid|gclid|igshid|ref|ref_src|source|cmpid|at_)/.test(k);
    });
    s = base + (kept.length ? "?" + kept.sort().join("&") : "");
  }
  return s.replace(/\/+$/, "");
}

/* Same headline from two outlets or two feeds is still one story. */
function titleKey(t) {
  return String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().slice(0, 70);
}

/* The model guesses grades from the outlet name and often over-rates domains
   it has never heard of. Reliability (the letter) is anchored to what we
   actually know about the source; credibility (the digit) stays its call. */
var MIN_RELIABILITY = { wire: "A", indian: "B", defence: "B", other: "D" };
function clampGrade(grade, typ) {
  var g = String(grade || "").toUpperCase();
  if (!GRADE_RE.test(g)) return GRADES[typ];
  var floor = MIN_RELIABILITY[typ] || "D";
  var letter = g.charAt(0) < floor ? floor : g.charAt(0);
  return letter + g.charAt(1);
}

var GRADE_RE = /^[A-F][1-6]$/;
function words(t) { return t.toLowerCase().split(/\s+/).filter(function (x) { return x.length > 4; }); }
/* Words that carry no signal on their own. */
var STOP = ("the a an and or of in on at to for with from by is are was were be been will "
  + "has have had that this its it as but not new more than after before over under into out up down "
  + "says said amid ahead first").split(" ");

/* Words that are true but far too common in this domain to identify a story
   by themselves — two of them together still counts. */
var WEAK = ("india indian pakistan pakistani china chinese military defence defense army navy air "
  + "force forces news report reports government minister ministry national security delhi beijing "
  + "islamabad state country line system systems "
  /* ambiguous outside this domain: "fires" is gunnery here but flames elsewhere,
     "operations" and "exercise" are equally at home in civilian copy */
  + "fire fires operation operations exercise exercises unit units").split(" ");

function sigWords(term) {
  return term.toLowerCase().split(/[^a-z0-9]+/)
    .filter(function (w) { return w.length >= 3 && STOP.indexOf(w) === -1; });
}
/* An acronym written in caps in the keyword (LAC, LoC, UAV) is a strong
   signal even though it is short. */
function isStrong(word, term) {
  if (WEAK.indexOf(word) > -1) return false;
  if (word.length >= 5) return true;
  return new RegExp("\\b" + word.toUpperCase() + "\\b").test(term);
}
/* Contiguous runs of two or more words from the keyword — "line of control",
   "india china", "precision fires" — are decisive when they appear intact. */
function phrases(term) {
  var parts = term.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean), out = [], i, j;
  for (i = 0; i < parts.length; i++)
    for (j = i + 2; j <= Math.min(parts.length, i + 4); j++)
      out.push(parts.slice(i, j).join(" "));
  return out;
}

function matchesTerm(term, blob) {
  var t = term.toLowerCase().trim();
  if (!t) return false;
  if (blob.indexOf(t) > -1) return true;

  var mode = S.match || "balanced";
  var words = sigWords(term);
  if (!words.length) return false;

  var strongHits = 0, weakHits = 0;
  words.forEach(function (w) {
    if (blob.indexOf(w) === -1) return;
    if (isStrong(w, term)) strongHits++; else weakHits++;
  });

  var phraseHit = phrases(term).some(function (p) { return blob.indexOf(p) > -1; });

  if (mode === "broad") return phraseHit || strongHits >= 1 || weakHits >= 1;
  if (mode === "strict") return phraseHit || strongHits >= 2 || (strongHits >= 1 && weakHits >= 1);
  /* balanced */
  return phraseHit || strongHits >= 1 || weakHits >= 2;
}

/* tiny DOM builder */
function el(tag, attrs) {
  var n = document.createElement(tag), i, k;
  if (attrs) for (k in attrs) {
    if (k === "text") n.textContent = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "on") for (var ev in attrs[k]) n.addEventListener(ev, attrs[k][ev]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  for (i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) c.forEach(function (x) { if (x) n.appendChild(x); });
    else n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}

/* ---------------------------- state ------------------------------- */

var S = {
  tab: "feed", filter: "ALL", view: "cards", sort: "newest", match: "balanced",
  watch: SEED.map(function (s) { return { id: hash(s.term), term: s.term, cat: s.cat, alert: s.alert, on: true }; }),
  feeds: DEFAULT_FEEDS.slice(),
  keys: { groq: "", gemini: "", openrouter: "" },
  chain: ["groq", "gemini", "openrouter"],
  relays: DEFAULT_RELAYS.slice(),
  bestRelay: null,
  items: [], seen: [], lastScan: null, brief: "",
  engine: {}, feedState: {}, relayState: {}, feedAdd: "", tagging: "", lastSweepStats: null,
  briefSections: [], briefStatus: "",
  scanning: false, briefing: false, status: "", err: ""
};

function load() {
  try {
    var cfg = JSON.parse(localStorage.getItem("mw:config") || "null");
    if (cfg) {
      if (cfg.watch && cfg.watch.length) S.watch = cfg.watch;
      if (cfg.feeds && cfg.feeds.length) S.feeds = cfg.feeds;
      if (cfg.keys) Object.assign(S.keys, cfg.keys);
      if (cfg.chain && cfg.chain.length) S.chain = cfg.chain;
      if (cfg.match) S.match = cfg.match;
      if (cfg.relays && cfg.relays.length) S.relays = cfg.relays;
      else if (cfg.proxy) S.relays = [cfg.proxy].concat(
        DEFAULT_RELAYS.filter(function (r) { return r !== cfg.proxy; }));
      /* pick up newly added or corrected defaults without discarding
         whatever order the user has settled on */
      DEFAULT_RELAYS.forEach(function (r) {
        if (S.relays.indexOf(r) === -1) S.relays.push(r);
      });
    }
    var f = JSON.parse(localStorage.getItem("mw:feed") || "null");
    if (f) {
      S.items = f.items || []; S.seen = f.seen || [];
      S.lastScan = f.lastScan || null; S.brief = f.brief || "";
      S.briefSections = f.briefSections || [];
    }
  } catch (e) { /* corrupt or unavailable storage — start clean */ }
}
function saveCfg() {
  try {
    localStorage.setItem("mw:config", JSON.stringify(
      { watch: S.watch, feeds: S.feeds, keys: S.keys, chain: S.chain, relays: S.relays, match: S.match }));
  } catch (e) {}
}
function saveFeed() {
  try {
    localStorage.setItem("mw:feed", JSON.stringify(
      { items: S.items, seen: S.seen, lastScan: S.lastScan, brief: S.brief, briefSections: S.briefSections }));
  } catch (e) {}
}

/* ---------------------------- fetching ---------------------------- */

/* Every request is capped. A dead source is skipped, never allowed to
   block the queue — this is what stalled the first build. */
function timedFetch(u) {
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, FETCH_TIMEOUT);
  var opts = ctl ? { signal: ctl.signal } : {};
  return fetch(u, opts).then(function (r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }, function (e) {
    clearTimeout(timer);
    throw new Error(e && e.name === "AbortError" ? "timed out" : "no response");
  });
}

/* Direct first, then each relay in turn. Whichever relay answers is
   remembered and tried first from then on. */
function getText(url) {
  var relays = S.relays.filter(Boolean);
  var order = relays.slice();
  if (S.bestRelay && order.indexOf(S.bestRelay) > 0) {
    order = [S.bestRelay].concat(order.filter(function (r) { return r !== S.bestRelay; }));
  }
  var targets = [{ u: url, r: null }].concat(order.map(function (r) {
    return { u: r + encodeURIComponent(url), r: r };
  }));
  var i = 0;
  function next() {
    if (i >= targets.length) return Promise.reject(new Error("unreachable"));
    var t = targets[i++];
    return timedFetch(t.u).then(function (txt) {
      if (t.r) S.bestRelay = t.r;
      return txt;
    }, next);
  }
  return next();
}

/* Run tasks a few at a time. One failure never stops the rest. */
function pool(tasks, limit, onTick) {
  var i = 0, done = 0, total = tasks.length;
  if (!total) return Promise.resolve();
  return new Promise(function (resolve) {
    function launch() {
      if (i >= total) return;
      var t = tasks[i++];
      t().catch(function () {}).then(function () {
        done++;
        if (onTick) onTick(done, total);
        if (done === total) resolve();
        else launch();
      });
    }
    for (var k = 0; k < Math.min(limit, total); k++) launch();
  });
}

function gdelt(term) {
  var url = "https://api.gdeltproject.org/api/v2/doc/doc?query=" +
    encodeURIComponent(term + " sourcelang:english") +
    "&mode=ArtList&maxrecords=20&timespan=4d&sort=datedesc&format=json";
  return getText(url).then(function (t) {
    var data = JSON.parse(t);
    return (data.articles || []).map(function (a) {
      return { hl: a.title || "", url: a.url || "", src: a.domain || domainOf(a.url),
               img: (a.socialimage && String(a.socialimage).indexOf("http") === 0) ? a.socialimage : "",
               dt: gdeltISO(a.seendate), via: "GDELT" };
    });
  });
}

function stripHtml(s) {
  return String(s || "")
    .replace(/<!\[CDATA\[|\]\]>/g, "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
    .replace(/&quot;/g, '"').replace(/&#0?39;/g, "'")
    .replace(/\s+/g, " ").trim();
}

/* Pull a usable thumbnail: media:thumbnail / media:content / enclosure,
   else the first <img> inside the description or content:encoded. */
function rssImage(n, rawDesc) {
  function attr(tag, a) {
    var e = n.getElementsByTagName(tag)[0];
    return e ? (e.getAttribute(a) || "") : "";
  }
  var u = attr("media:thumbnail", "url") || attr("media:content", "url");
  if (!u) {
    var enc = n.querySelector("enclosure");
    if (enc && /image/i.test(enc.getAttribute("type") || "")) u = enc.getAttribute("url") || "";
  }
  if (!u && rawDesc) {
    var m = rawDesc.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (m) u = m[1];
  }
  if (!u) return "";
  if (u.indexOf("//") === 0) u = "https:" + u;
  return u.indexOf("http") === 0 ? u : "";
}

/* Accepts a plain site address (bbc.com) and finds its actual feed:
   tries the URL as-is, then any <link rel=alternate> the page declares,
   then the usual suffixes. */
function normaliseUrl(u) {
  u = String(u || "").trim();
  if (!u) return "";
  if (u.indexOf("http") !== 0) u = "https://" + u.replace(/^\/+/, "");
  return u;
}
function looksLikeFeed(txt) {
  return /<(rss|feed|rdf:RDF)[\s>]/i.test(txt.slice(0, 2000));
}
function discoverFeed(input) {
  var base = normaliseUrl(input);
  if (!base) return Promise.reject(new Error("enter a web address"));

  return getText(base).then(function (txt) {
    if (looksLikeFeed(txt)) return base;

    /* page declares its feed */
    var m = txt.match(/<link[^>]+rel=["']alternate["'][^>]*>/gi) || [];
    for (var i = 0; i < m.length; i++) {
      if (!/type=["'][^"']*(rss|atom)[^"']*["']/i.test(m[i])) continue;
      var href = (m[i].match(/href=["']([^"']+)["']/i) || [])[1];
      if (!href) continue;
      if (href.indexOf("//") === 0) href = "https:" + href;
      else if (href.indexOf("http") !== 0) {
        try { href = new URL(href, base).href; } catch (e) { continue; }
      }
      return href;
    }
    throw new Error("no feed declared");
  }).catch(function () {
    /* fall back to common feed paths */
    var root;
    try { root = new URL(base).origin; } catch (e) { throw new Error("not a valid address"); }
    var paths = ["/feed", "/rss", "/feed/", "/rss.xml", "/feeds/rss.xml", "/index.xml"];
    var i = 0;
    function tryNext() {
      if (i >= paths.length) throw new Error("no feed found at that address");
      var candidate = root + paths[i++];
      return getText(candidate).then(function (t) {
        if (looksLikeFeed(t)) return candidate;
        return tryNext();
      }, tryNext);
    }
    return tryNext();
  });
}

function parseRss(xml, defaultSrc) {
  var doc = new DOMParser().parseFromString(xml, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("bad feed XML");
  var nodes = [].slice.call(doc.querySelectorAll("item, entry")).slice(0, 25);
  return nodes.map(function (n) {
    var linkEl = n.querySelector("link");
    var url = ((linkEl && linkEl.textContent) || "").trim() ||
              (linkEl && linkEl.getAttribute("href")) || "";
    var titleEl = n.querySelector("title");
    var hl = ((titleEl && titleEl.textContent) || "").trim();
    var srcEl = n.querySelector("source");
    var src = defaultSrc || ((srcEl && srcEl.textContent) || "").trim();
    if (!defaultSrc) {
      var m = hl.match(/^(.*)\s+-\s+([^-]{2,40})$/);
      if (m) { hl = m[1].trim(); src = m[2].trim(); }
    }
    var descEl = n.querySelector("description") || n.querySelector("summary");
    var ce = n.getElementsByTagName("content:encoded")[0];
    var rawDesc = (descEl && descEl.textContent) || (ce && ce.textContent) || "";
    var desc = stripHtml(rawDesc).slice(0, 400);
    var pd = n.querySelector("pubDate"), up = n.querySelector("updated");
    var raw = (pd && pd.textContent) || (up && up.textContent) || "";
    var d = new Date(raw);
    return { hl: hl, url: url, src: src || domainOf(url), desc: desc,
             img: rssImage(n, rawDesc),
             dt: isNaN(d) ? new Date().toISOString() : d.toISOString(),
             via: defaultSrc ? "RSS" : "GNEWS" };
  });
}

function googleNews(term) {
  var url = "https://news.google.com/rss/search?q=" +
    encodeURIComponent(term + " when:4d") + "&hl=en-IN&gl=IN&ceid=IN:en";
  return getText(url).then(function (t) { return parseRss(t, null); });
}

/* ------------------------- summarisation -------------------------- */

function parseArray(raw) {
  var clean = String(raw).replace(/```json/g, "").replace(/```/g, "").trim();
  var a = clean.indexOf("["), b = clean.lastIndexOf("]");
  if (a === -1 || b === -1) return [];
  try { var o = JSON.parse(clean.slice(a, b + 1)); return Array.isArray(o) ? o : []; }
  catch (e) { return []; }
}

function runChain(prompt) {
  var i = 0, last = "no engine configured";
  function next() {
    if (i >= S.chain.length) return Promise.reject(new Error("All engines unavailable — " + last));
    var p = S.chain[i++], def = PROVIDERS[p];
    if (!def) return next();
    if (!S.keys[p]) { S.engine[p] = "no key"; return next(); }
    return def.call(prompt, S.keys[p]).then(function (out) {
      S.engine[p] = "ok"; return out;
    }).catch(function (e) {
      S.engine[p] = e.rate ? "rate limited" : (e.message || "failed");
      last = e.message || "failed";
      return next();
    });
  }
  return next();
}

/* ---------------------------- sweep ------------------------------- */

function setStatus(t) {
  S.status = t;
  var n = document.getElementById("scanmsg");
  if (n) n.textContent = t;
}

function sweep(onlyCat) {
  var active = S.watch.filter(function (w) { return w.on && (!onlyCat || w.cat === onlyCat); });
  if (!active.length) { S.err = "No active keywords. Add one in WATCH before sweeping."; render(); return; }

  S.err = ""; S.scanning = true; S.tab = "feed"; S.engine = {}; S.feedState = {};
  render();

  var raw = [];
  var liveFeeds = S.feeds.filter(function (f) { return f.on; });
  var tasks = [];

  /* outlet feeds */
  liveFeeds.forEach(function (f) {
    S.feedState[f.id] = "waiting";
    tasks.push(function () {
      return getText(f.url).then(function (t) {
        var arts = parseRss(t, f.name);
        S.feedState[f.id] = arts.length + " items";
        arts.forEach(function (a) { raw.push(a); });
      }, function (e) {
        S.feedState[f.id] = e.message || "unreachable";
      });
    });
  });

  /* GDELT + Google News per keyword */
  active.forEach(function (t) {
    tasks.push(function () {
      return gdelt(t.term).then(function (a) {
        a.forEach(function (x) { x.cat = t.cat; raw.push(x); });
      }, function () {});
    });
    tasks.push(function () {
      return googleNews(t.term).then(function (a) {
        a.forEach(function (x) { x.cat = t.cat; raw.push(x); });
      }, function () {});
    });
  });

  pool(tasks, POOL_LIMIT, function (d, tot) {
    setStatus("Collecting — " + d + " of " + tot + " sources · " + raw.length + " headlines");
  }).then(function () {
    var tagged = [], dropIrrelevant = 0, dropOld = 0;
    raw.forEach(function (a) {
      if (!a.hl || !a.url) return;
      /* Every item earns its category by matching the keyword, whatever
         source it came from. GDELT's full-text search is loose and returns
         off-topic stories for a query; without this they inherited the
         category of whichever keyword happened to fetch them. */
      var blob = (a.hl + " " + (a.desc || "")).toLowerCase();
      var pool = a.cat
        ? active.filter(function (w) { return w.cat === a.cat; })
        : active;
      var hit = pool.find(function (w) { return matchesTerm(w.term, blob); });
      if (!hit && a.cat) hit = active.find(function (w) { return matchesTerm(w.term, blob); });
      if (!hit) { dropIrrelevant++; return; }
      var cat = hit.cat;

      var dom = a.src && a.src.indexOf(".") > -1 ? a.src : domainOf(a.url);

      /* GDELT and Google News are windowed to 4 days, but outlet RSS returns
         whatever the feed holds — which can be months old. Apply the same
         window to everything so stale posts don't arrive marked NEW. */
      var age = Date.now() - new Date(a.dt).getTime();
      if (isFinite(age) && age > MAX_AGE_MS) { dropOld++; return; }

      tagged.push({ id: hash(canonUrl(a.url)), hl: a.hl.slice(0, 150), url: a.url,
                    src: a.src || dom, dt: a.dt, via: a.via, cat: cat, typ: classify(dom),
                    desc: (a.desc || "").slice(0, 400), img: a.img || "" });
    });

    /* Collapse duplicates by canonical URL and by headline. Where the same
       story arrives twice, keep the better-ranked source. */
    var byId = {}, byTitle = {}, fresh = [];
    tagged.sort(function (a, b) { return RANK[a.typ] - RANK[b.typ]; });
    tagged.forEach(function (a) {
      var tk = titleKey(a.hl);
      if (byId[a.id] || (tk && byTitle[tk])) return;
      byId[a.id] = 1; if (tk) byTitle[tk] = 1;
      fresh.push(a);
    });

    /* and against everything already in the feed */
    var knownId = {}, knownTitle = {};
    S.items.forEach(function (i) {
      knownId[i.id] = 1;
      var k = titleKey(i.hl); if (k) knownTitle[k] = 1;
    });
    fresh = fresh.filter(function (a) {
      return !knownId[a.id] && !knownTitle[titleKey(a.hl)];
    }).sort(function (a, b) {
      return (RANK[a.typ] - RANK[b.typ]) || String(b.dt).localeCompare(String(a.dt));
    }).slice(0, 40);

    S.lastSweepStats = { collected: raw.length, kept: fresh.length,
                         irrelevant: dropIrrelevant, old: dropOld };
    if (!fresh.length) {
      S.scanning = false; S.lastScan = new Date().toISOString(); setStatus("");
      var dead = liveFeeds.filter(function (f) {
        return (S.feedState[f.id] || "").indexOf("items") === -1;
      }).length;
      S.err = dead >= liveFeeds.length
        ? "Every source failed. Open SETUP, tap Test relays, and switch to whichever one reports working."
        : (raw.length
            ? "Collected " + raw.length + " headlines but kept none — " + dropIrrelevant +
              " did not match your keywords and " + dropOld + " were older than a week. " +
              "If that seems wrong, set Keyword matching to Broad in SETUP."
            : "Sweep finished but found nothing. Check SETUP — Test relays.");
      saveFeed(); render(); return;
    }

    /* 4. summarise in batches of eight */
    var batches = [], i;
    for (i = 0; i < fresh.length; i += 6) batches.push(fresh.slice(i, i + 6));
    var done = [];

    var work = batches.reduce(function (acc, batch, bi) {
      return acc.then(function () {
        setStatus("Summarising batch " + (bi + 1) + " of " + batches.length);
        var list = batch.map(function (a, n) {
          var extra = a.desc && a.desc.length > 20 &&
            a.desc.toLowerCase().indexOf(a.hl.toLowerCase().slice(0, 30)) !== 0
            ? " :: " + a.desc : "";
          return (n + 1) + ". [" + a.src + "] " + a.hl + extra;
        }).join("\n");
        var prompt =
"For each numbered item below, write a summary for a defence staff officer.\n\n" +
"Every summary must be 24-30 words. Cover what happened, who is involved, and why it matters.\n" +
"Where text follows a double colon, that is the source's own description — draw on it.\n" +
"Where only a headline is given, expand on what the headline states and its significance, but do NOT invent names, figures, dates or events that are not implied by it.\n\n" +
"Return ONLY a JSON array, no prose and no code fences, one object per item in the same order:\n" +
'[{"n":1,"sum":"summary text","pri":"flash|priority|routine","grd":"B2"}]\n\n' +
'pri: "flash" only for a major breaking development, "priority" for significant, otherwise "routine".\n' +
"grd: source reliability A-F then information credibility 1-6, judged from the outlet named in brackets.\n\n" +
"ITEMS:\n" + list;
        return runChain(prompt).then(function (out) {
          var parsed = parseArray(out);
          batch.forEach(function (a, n) {
            var m = parsed.find(function (x) { return Number(x.n) === n + 1; }) || {};
            done.push(Object.assign({}, a, {
              sum: String(m.sum || "").slice(0, 480),
              pri: ["flash","priority","routine"].indexOf(m.pri) > -1 ? m.pri : "routine",
              grd: clampGrade(m.grd, a.typ)
            }));
          });
        }).catch(function (e) {
          var why = S.chain.map(function (p) {
            return (PROVIDERS[p] ? PROVIDERS[p].label : p) + ": " + (S.engine[p] || "not tried");
          }).join(" · ");
          var noKeys = !S.chain.some(function (p) { return S.keys[p]; });
          S.err = noKeys
            ? "No API key set, so nothing could be summarised. Open SETUP → Keys and paste a Groq key (console.groq.com → API Keys). Headlines were still collected."
            : "Summarising failed — " + why + ". Headlines were still collected; fix the key in SETUP and tap Summarise missing.";
          batch.forEach(function (a) {
            done.push(Object.assign({}, a, { sum: "", pri: "routine", grd: GRADES[a.typ] }));
          });
        });
      });
    }, Promise.resolve());

    return work.then(function () {
      S.items = done.concat(S.items).slice(0, 150);
      S.lastScan = new Date().toISOString();
      S.scanning = false; setStatus(""); saveFeed(); render();
    });
  }).catch(function (e) {
    S.scanning = false; setStatus(""); S.err = "Sweep failed — " + e.message; render();
  });
}

/* ---------------------------- brief ------------------------------- */

/* Summarise items already in the feed that never got a summary — used when
   the engine was missing or rate limited during the sweep. No re-fetching. */
function summariseMissing() {
  var pending = S.items.filter(function (i) { return !i.sum; });
  if (!pending.length) { S.err = "Everything in the feed is already summarised."; render(); return; }
  if (!S.chain.some(function (p) { return S.keys[p]; })) {
    S.err = "No API key set. Open SETUP → Keys and paste a Groq key first.";
    render(); return;
  }
  S.err = ""; S.scanning = true; S.engine = {}; render();

  var batches = [], i;
  for (i = 0; i < pending.length; i += 6) batches.push(pending.slice(i, i + 6));

  batches.reduce(function (acc, batch, bi) {
    return acc.then(function () {
      setStatus("Summarising " + (bi + 1) + " of " + batches.length);
      var list = batch.map(function (a, n) {
        var extra = a.desc && a.desc.length > 20 ? " :: " + a.desc : "";
        return (n + 1) + ". [" + a.src + "] " + a.hl + extra;
      }).join("\n");
      var prompt =
"For each numbered item below, write a summary for a defence staff officer.\n\n" +
"Every summary must be 24-30 words. Cover what happened, who is involved, and why it matters.\n" +
"Where text follows a double colon, that is the source's own description — draw on it.\n" +
"Where only a headline is given, expand on what the headline states and its significance, but do NOT invent names, figures, dates or events that are not implied by it.\n\n" +
"Return ONLY a JSON array, no prose and no code fences, one object per item in the same order:\n" +
'[{"n":1,"sum":"summary text","pri":"flash|priority|routine","grd":"B2"}]\n\n' +
'pri: "flash" only for a major breaking development, "priority" for significant, otherwise "routine".\n' +
"grd: source reliability A-F then information credibility 1-6, judged from the outlet named in brackets.\n\n" +
"ITEMS:\n" + list;
      return runChain(prompt).then(function (out) {
        var parsed = parseArray(out);
        batch.forEach(function (a, n) {
          var m = parsed.find(function (x) { return Number(x.n) === n + 1; }) || {};
          if (!m.sum) return;
          a.sum = String(m.sum).slice(0, 480);
          a.pri = ["flash","priority","routine"].indexOf(m.pri) > -1 ? m.pri : "routine";
          a.grd = clampGrade(m.grd, a.typ);
        });
        saveFeed(); render();
      }, function () { /* keep going; the rest may still succeed */ });
    });
  }, Promise.resolve()).then(function () {
    var left = S.items.filter(function (i) { return !i.sum; }).length;
    S.scanning = false; setStatus("");
    if (left) S.err = left + " item" + (left === 1 ? "" : "s") + " still unsummarised — the engine refused or rate limited. Try again shortly.";
    saveFeed(); render();
  });
}

function makeBrief() {
  var pool = S.items.filter(function (i) { return i.sum; });
  if (!pool.length) { S.err = "Nothing summarised to brief on. Run a sweep first."; render(); return; }
  S.err = ""; S.briefing = true; S.tab = "brief"; S.brief = ""; S.briefSections = []; render();

  /* group by category, densest first */
  var groups = {};
  pool.forEach(function (i) { (groups[i.cat] = groups[i.cat] || []).push(i); });
  var cats = Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; });

  var sections = [];
  var work = cats.reduce(function (acc, cat, ci) {
    return acc.then(function () {
      S.briefStatus = "Writing " + cat + " — " + (ci + 1) + " of " + cats.length;
      render();
      var lines = groups[cat].slice(0, 12).map(function (i) {
        return "- " + i.hl + " (" + i.src + ") :: " + i.sum;
      }).join("\n");
      var prompt =
"Write one section of a media brief for a defence staff officer, covering the category " + cat + ".\n\n" +
"Write approximately 100 words as flowing prose — not bullet points, not a list of headlines. Draw the items together into a coherent picture: what is happening, what is driving it, and what it means. Where items relate, connect them. Where they do not, say so plainly rather than forcing a link.\n\n" +
"Use only the material given. Do not invent figures, dates or attributions. Plain text only, no markdown symbols, no heading — the heading is added separately.\n\n" +
"ITEMS:\n" + lines;
      return runChain(prompt).then(function (out) {
        sections.push({ cat: cat, n: groups[cat].length, text: out.trim() });
      }, function (e) {
        sections.push({ cat: cat, n: groups[cat].length,
                        text: "Section not generated — " + (e.message || "engine unavailable") + "." });
      });
    });
  }, Promise.resolve());

  work.then(function () {
    /* bottom line drawn across the finished sections */
    S.briefStatus = "Writing bottom line";
    render();
    var digest = sections.map(function (s) { return s.cat + ": " + s.text; }).join("\n\n");
    var prompt =
"Below are the sections of a media brief. Write a BOTTOM LINE of two or three sentences giving the overall picture across all of them, then a single line headed WATCH naming what to track over the next 72 hours.\n\n" +
"Plain text, no markdown symbols. Be specific. If the material does not support a judgement, say so.\n\n" + digest;
    return runChain(prompt).then(function (out) {
      S.brief = out.trim();
    }, function () { S.brief = ""; });
  }).then(function () {
    S.briefSections = sections;
    S.briefStatus = ""; S.briefing = false; saveFeed(); render();
  });
}

/* ---------------------------- auto-tagging ------------------------ */

var TAG_RULES = [
  ["SPACE",       ["satellite","space","orbit","isro","launch vehicle","spacecraft","sda"]],
  ["AIR",         ["drone","uav","ucav","aircraft","fighter","air force","helicopter","airbase","loitering"]],
  ["MARITIME",    ["navy","naval","maritime","submarine","warship","carrier","indian ocean","port"]],
  ["CYBER",       ["cyber","hacking","malware","ransomware","network attack","data breach"]],
  ["FIRES",       ["artillery","rocket","missile","howitzer","precision fire","mlrs"]],
  ["NORTHERN",    ["china","lac","ladakh","arunachal","tibet","pla"]],
  ["WESTERN",     ["pakistan","loc","line of control","pok","jammu","kashmir"]],
  ["PROCUREMENT", ["procurement","contract","tender","acquisition","rfi","rfp","defence deal"]],
  ["TECH",        ["artificial intelligence"," ai ","machine learning","quantum","semiconductor","autonomy"]],
  ["FORCE",       ["army","infantry","brigade","division","exercise","troops","regiment"]]
];

function localTag(term) {
  var t = " " + term.toLowerCase() + " ";
  for (var i = 0; i < TAG_RULES.length; i++) {
    var cat = TAG_RULES[i][0], keys = TAG_RULES[i][1];
    for (var j = 0; j < keys.length; j++) {
      if (t.indexOf(keys[j]) > -1) return cat;
    }
  }
  return "";
}

/* Ask the engine to place the term against categories already in use,
   falling back to the rule set and finally to GENERAL. */
function autoTag(term) {
  var existing = [];
  S.watch.forEach(function (w) { if (existing.indexOf(w.cat) === -1) existing.push(w.cat); });
  var guess = localTag(term);

  var hasEngine = S.chain.some(function (p) { return S.keys[p]; });
  if (!hasEngine) return Promise.resolve(guess || "GENERAL");

  var prompt =
"Assign one short category tag to this news watch keyword, for a defence staff officer.\n\n" +
"KEYWORD: " + term + "\n\n" +
"Existing tags in use: " + (existing.join(", ") || "none") + "\n\n" +
"Reuse an existing tag if it genuinely fits. Otherwise invent one.\n" +
"Reply with ONLY the tag: one word, uppercase, maximum 12 characters. No punctuation, no explanation.";

  return runChain(prompt).then(function (out) {
    var tag = String(out || "").trim().toUpperCase().replace(/[^A-Z0-9 ]/g, "").split(/\s+/)[0];
    return (tag && tag.length <= 14) ? tag : (guess || "GENERAL");
  }, function () {
    return guess || "GENERAL";
  });
}
